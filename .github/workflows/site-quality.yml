name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Check learning content and quiz bank
        run: node scripts/check_learning.js
      - name: Check local HTML assets and links
        run: python3 scripts/check_site.py
      - name: Check sitemap, sandbox and contribution templates
        run: python3 scripts/check_project.py
      - name: Audit HTML accessibility (non-blocking report)
        run: python3 scripts/audit_accessibility.py

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
