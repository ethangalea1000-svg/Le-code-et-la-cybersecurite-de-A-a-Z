<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Le Code & la Cybersécurité</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><span>&lt;/&gt;</span> LE CODE <b>&amp;</b> LA CYBERSÉCURITÉ</a><nav><a href="parcours.html">Parcours</a><a href="cours.html">Cours</a><a href="projets.html">Projets</a><a href="quiz.html">Quiz</a></nav></header><main><section class="section dark"><small>ENTRAÎNEMENT</small><h1>Quiz A → Z</h1><div class="quiz"><div><span id="qCount">Question 1</span><span id="score">Score : 0</span></div><h2 id="question"></h2><div id="answers"></div><button id="next" class="btn" disabled>Question suivante</button><p id="result"></p></div></section></main><footer>LE CODE &amp; LA CYBERSÉCURITÉ DE A À Z</footer><script>const qs=[["Quel langage structure une page web ?","HTML",["HTML","CSS","Python","SQL"]],["À quoi sert CSS ?","Présenter une page",["Présenter une page","Gérer une base","Créer un DNS","Versionner du code"]],["À quoi sert JavaScript ?","Ajouter de la logique et de l'interaction",["Ajouter de la logique et de l'interaction","Créer uniquement des images","Remplacer HTML","Créer une adresse IP"]],["À quoi sert Git ?","Suivre les versions",["Suivre les versions","Chiffrer un disque","Créer un Wi-Fi","Héberger un DNS"]],["Quel principe est essentiel en cybersécurité ?","Agir uniquement sur des systèmes autorisés",["Agir uniquement sur des systèmes autorisés","Partager ses mots de passe","Désactiver les protections","Tester n'importe quel site"]],["Que signifie DNS ?","Domain Name System",["Domain Name System","Digital Network Security","Data Number System","Dynamic Node Service"]]];let i=0,s=0,answered=false;const q=document.querySelector("#question"),a=document.querySelector("#answers"),n=document.querySelector("#next"),r=document.querySelector("#result"),sc=document.querySelector("#score"),ct=document.querySelector("#qCount");function render(){answered=false;n.disabled=true;r.textContent="";ct.textContent="Question "+(i+1)+" / "+qs.length;sc.textContent="Score : "+s;q.textContent=qs[i][0];a.innerHTML="";qs[i][2].forEach(x=>{let b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>pick(b,x);a.appendChild(b)})}function pick(b,x){if(answered)return;answered=true;let good=qs[i][1];document.querySelectorAll(".answer").forEach(v=>{v.disabled=true;if(v.textContent===good)v.classList.add("correct")});if(x===good){s++;r.textContent="Correct."}else{b.classList.add("wrong");r.textContent="La bonne réponse est : "+good+"."}sc.textContent="Score : "+s;n.disabled=false}n.onclick=()=>{i++;if(i<qs.length)render();else{q.textContent="Quiz terminé";a.innerHTML="";n.textContent="Recommencer";r.textContent="Score final : "+s+" / "+qs.length;n.onclick=()=>{i=0;s=0;n.textContent="Question suivante";render()}}};render();</script></body></html>
