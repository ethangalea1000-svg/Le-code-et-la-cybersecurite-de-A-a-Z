<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz — Le Code & la Cybersécurité</title>
<link rel="stylesheet" href="style.css?v=20261006">
</head>
<body>
<header><a class="brand" href="index.html"><span>&lt;/&gt;</span> LE CODE <b>&amp;</b> LA CYBERSÉCURITÉ</a><nav><a href="parcours.html">Parcours</a><a href="cours.html">Cours</a><a href="projets.html">Projets</a><a href="quiz.html">Quiz</a></nav></header>
<main><section class="section dark"><small>ENTRAÎNEMENT</small><h1>Quiz A → Z</h1>
<p class="muted">Quiz infini : une banque de 1000 questions est disponible. Ta progression est automatiquement enregistrée dans ton navigateur.</p>
<div class="quiz">
<div><span id="qCount"></span><span id="score"></span></div>
<p id="stats" class="muted"></p>
<h2 id="question"></h2><div id="answers"></div>
<button id="next" class="btn" disabled>Question suivante</button>
<button id="reset" class="btn ghost" type="button">Réinitialiser la progression</button>
<p id="result"></p>
</div></section></main>
<footer>LE CODE &amp; LA CYBERSÉCURITÉ DE A À Z</footer>
<script>
const seedQuestions=questions;
const contexts=[
  "Révision rapide",
  "Application pratique",
  "Question de cours",
  "Situation de développement",
  "Vérification des fondamentaux",
  "Analyse technique",
  "Défi débutant",
  "Défi intermédiaire",
  "Défi avancé",
  "Question de synthèse",
  "Cas concret",
  "Point de vocabulaire",
  "Contrôle de compréhension",
  "Mise en situation",
  "Question piège",
  "Réflexion technique",
  "Révision A → Z",
  "Entraînement pratique",
  "Challenge",
  "Examen blanc"
];
const generated=[];
seedQuestions.forEach((item,index)=>{
  contexts.forEach((context,variant)=>{
    generated.push([
      context+" — "+item[0],
      item[1],
      item[2],
      "Question "+(index*contexts.length+variant+1)+" / 1000"
    ]);
  });
});
const questions=generated;
const KEY="quizAZProgressV2";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||{answered:0,correct:0,bestStreak:0,streak:0,lastIndex:-1};}catch(e){state={answered:0,correct:0,bestStreak:0,streak:0,lastIndex:-1};}
let current=-1,answered=false;
const q=document.querySelector("#question"),a=document.querySelector("#answers"),n=document.querySelector("#next"),r=document.querySelector("#result"),sc=document.querySelector("#score"),ct=document.querySelector("#qCount"),stats=document.querySelector("#stats");

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function nextQuestion(){
 let candidate;
 do{candidate=Math.floor(Math.random()*questions.length)}while(questions.length>1&&candidate===state.lastIndex);
 current=candidate;state.lastIndex=current;save();answered=false;n.disabled=true;r.textContent="";
 const item=questions[current];ct.textContent="Question "+(state.answered+1)+" • Quiz infini";sc.textContent="Score : "+state.correct;
 stats.textContent="Répondues : "+state.answered+" • Réussites : "+state.correct+" • Série : "+state.streak+" • Meilleure série : "+state.bestStreak;
 q.textContent=item[0];a.innerHTML="";
 [...item[2]].sort(()=>Math.random()-.5).forEach(x=>{const b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>pick(b,x);a.appendChild(b);});
}
function pick(button,value){
 if(answered)return;answered=true;
 const good=questions[current][1];
 document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.textContent===good)b.classList.add("correct");});
 state.answered++;
 if(value===good){state.correct++;state.streak++;if(state.streak>state.bestStreak)state.bestStreak=state.streak;r.textContent="Correct.";}
 else{state.streak=0;button.classList.add("wrong");r.textContent="La bonne réponse est : "+good+".";}
 save();sc.textContent="Score : "+state.correct;stats.textContent="Répondues : "+state.answered+" • Réussites : "+state.correct+" • Série : "+state.streak+" • Meilleure série : "+state.bestStreak;n.disabled=false;
}
n.onclick=nextQuestion;
document.querySelector("#reset").onclick=()=>{if(confirm("Réinitialiser toute ta progression ?")){state={answered:0,correct:0,bestStreak:0,streak:0,lastIndex:-1};save();nextQuestion();}};
nextQuestion();
</script>
</body></html>
